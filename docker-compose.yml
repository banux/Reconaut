# Reconaut - dev local & déploiement simple.
#
# Source de verite : openspec/changes/add-tech-stack/specs/architecture/spec.md
# + openspec/changes/add-helm-chart/specs/open-source-governance/spec.md
#
# Invariants stack v1 :
#  - aucun broker externe (pas de Redis / RabbitMQ / NATS / Kafka)
#  - aucun stockage objet (pas de MinIO / S3)
#  - Postgres unique avec TimescaleDB + pgvector + AGE
#  - Ollama opt-in via docker-compose.override.yml.example
#
# Build local des images :
#   docker compose build
#
# Démarrage :
#   docker compose up -d
#   curl -fsS http://localhost:3000/healthz   # doit répondre 200 en < 60s

services:
  postgres:
    build: ./ops/postgres
    image: reconaut/postgres:dev
    container_name: reconaut-postgres
    environment:
      POSTGRES_DB: reconaut_development
      POSTGRES_USER: reconaut
      POSTGRES_PASSWORD: reconaut_dev_password
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconaut -d reconaut_development"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    image: reconaut/api:0.1.0-dev
    container_name: reconaut-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
      RECONAUT_OPERATOR_PASSWORD: changeme
      RECONAUT_EMBEDDER_PROVIDER: local
      # TLS posture désactivée pour le déploiement local : pas de
      # reverse proxy TLS amont par défaut. En prod, terminer TLS
      # à l'ingress et poser X-Forwarded-Proto: https.
      RECONAUT_MCP_TLS_REQUIRED: "false"
      SECRET_KEY_BASE: please-override-in-real-deployment-with-rails-secret
    volumes:
      - exports_data:/app/tmp/exports
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---- 6 binaires scanner spécialisés (un par scan_kind) -------------------
  # Pattern : même image (`reconaut/scanner:0.1.0-dev`), dispatch via
  # `RECONAUT_SCAN_KIND`. Cohérent avec replace-web-with-tui §3.1
  # (Workers de scan spécialisés).

  scanner-tcp_probe:
    build: ./apps/scanner
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-tcp_probe
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: tcp_probe
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
    restart: unless-stopped

  scanner-tls_capture:
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-tls_capture
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: tls_capture
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
    restart: unless-stopped

  scanner-http_banner:
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-http_banner
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: http_banner
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
      RECONAUT_HTTP_PROBE_TIMEOUT: "5"
      RECONAUT_HTTP_PROBE_MAX_BODY_KB: "32"
    restart: unless-stopped

  scanner-subdomain_enum:
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-subdomain_enum
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: subdomain_enum
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
    restart: unless-stopped

  scanner-service_fingerprint:
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-service_fingerprint
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: service_fingerprint
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
      RECONAUT_SSH_PROBE_TIMEOUT: "5"
    restart: unless-stopped

  scanner-dns_records:
    image: reconaut/scanner:0.1.0-dev
    container_name: reconaut-scanner-dns_records
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECONAUT_SCAN_KIND: dns_records
      RECONAUT_DATABASE_URL: postgresql://reconaut:reconaut_dev_password@postgres:5432/reconaut_development
    restart: unless-stopped

volumes:
  postgres_data:
  exports_data:
