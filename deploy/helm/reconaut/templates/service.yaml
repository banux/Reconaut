apiVersion: v1
kind: Service
metadata:
  name: {{ include "reconaut.fullname" . }}-api
  labels:
    {{- include "reconaut.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "reconaut.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
