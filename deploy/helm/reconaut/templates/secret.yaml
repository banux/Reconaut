#
# Secret : valeurs sensibles (DB URL, operator password, API keys
# d'embedder externe). Base64-encodées par Helm via `b64enc`.
#
# NB v1 : pas de gestion ESO / SealedSecrets / Vault — ces patterns
# relèvent de l'opérateur quand il les met en place. La valeur du
# Secret est posée à l'install puis n'est pas réécrite si l'opérateur
# la modifie en place (cf. `helm.sh/resource-policy: keep` à activer
# si besoin de préserver entre `helm upgrade`).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconaut.fullname" . }}-secret
  labels:
    {{- include "reconaut.labels" . | nindent 4 }}
type: Opaque
data:
  RECONAUT_DATABASE_URL: {{ required "postgres.url ou postgres.host+password requis" (include "reconaut.databaseUrl" .) | b64enc }}
  RECONAUT_OPERATOR_PASSWORD: {{ .Values.auth.bootstrap.operatorPassword | default "changeme" | b64enc }}
  SECRET_KEY_BASE: {{ randAlphaNum 64 | b64enc | quote }}
  {{- if eq .Values.embedder.provider "mistral" }}
  RECONAUT_EMBEDDER_MISTRAL_API_KEY: {{ required "embedder.mistral.apiKey required when provider=mistral" .Values.embedder.mistral.apiKey | b64enc }}
  {{- end }}
  {{- if eq .Values.embedder.provider "openai-compatible" }}
  RECONAUT_EMBEDDER_OPENAI_API_KEY: {{ required "embedder.openai.apiKey required when provider=openai-compatible" .Values.embedder.openai.apiKey | b64enc }}
  {{- end }}
---
# Secret dédié aux workers scanner-<kind>. NE CONTIENT PAS de DATABASE_URL :
# depuis remote-scanner-agents (2026-05-13), les workers Go ne touchent
# plus à Postgres et dialoguent UNIQUEMENT avec l'API Rails via MCP HTTP.
# Cf. openspec/changes/remote-scanner-agents/specs/platform/spec.md
#   -> Requirement: Workers déployables sans accès Postgres
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconaut.fullname" . }}-scanner-secret
  labels:
    {{- include "reconaut.labels" . | nindent 4 }}
    app.kubernetes.io/component: scanner
type: Opaque
data:
  RECONAUT_API_URL: {{ required "scanner.apiUrl required" .Values.scanner.apiUrl | b64enc }}
  RECONAUT_API_KEY: {{ required "scanner.apiKey required (worker:claim + worker:submit scopes)" .Values.scanner.apiKey | b64enc }}
