# Pipeline CI multi-stack.
#
# Source de verite : openspec/changes/add-tech-stack/tasks.md section 2.2.
#
# Jobs separes par sous-app pour que la latence d'un suite ne bloque pas
# l'autre. Cache des dependances keye par lockfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack-lint:
    name: stack-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_stack.sh
      - run: bash scripts/check_stack_test.sh
      # Linter d'allowlist REST. Cf. mcp-as-primary-entrypoint §2.1.
      - run: bash scripts/check_rest_allowlist.sh
      - run: bash scripts/check_rest_allowlist_test.sh
      # Linter MCP-only TUI. Cf. mcp-as-primary-entrypoint §3.3.
      - run: bash scripts/check_tui_mcp_only.sh
      - run: bash scripts/check_tui_mcp_only_test.sh
      # Linter spécialisation scanners. Cf. replace-web-with-tui §3.3.
      - run: bash scripts/check_scanner_specialization.sh
      - run: bash scripts/check_scanner_specialization_test.sh
      # Linter SPDX-License-Identifier headers. Cf. init-reconaut-platform §1.1.
      - run: bash scripts/check_spdx_headers.sh
      - run: bash scripts/check_spdx_headers_test.sh
      # Linter anti-auth du sondeur SSH. Cf. add-ssh-probe §1.3.
      - run: bash scripts/check_ssh_probe_no_auth.sh
      - run: bash scripts/check_ssh_probe_no_auth_test.sh
      # Linter no-billing-no-feature-gate. Cf. init-reconaut-platform §8.4.
      - run: bash scripts/check_no_billing.sh
      - run: bash scripts/check_no_billing_test.sh

  api-rspec:
    name: api-rspec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      - run: bundle exec rspec

  api-license-audit:
    name: api-license-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      # Echoue si une gem a une licence non listee dans
      # apps/api/doc/dependency_decisions.yml. Couvre add-graph-retrieval 9.1.
      - run: bundle exec license_finder action_items --decisions-file doc/dependency_decisions.yml

  # Le job web-vitest a été retiré par replace-web-with-tui : la SPA
  # Vue n'existe plus, remplacée par le binaire Go `reconautctl`
  # (job `tui-go` ci-dessous).

  scanner-go:
    name: scanner-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  tui-go:
    name: tui-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      # Cf. mcp-as-primary-entrypoint §3.1 / §3.2 : le binaire reconautctl
      # consomme MCP HTTP+SSE.
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
