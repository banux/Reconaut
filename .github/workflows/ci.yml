# Pipeline CI multi-stack.
#
# Source de verite : openspec/changes/add-tech-stack/tasks.md section 2.2.
#
# Jobs separes par sous-app pour que la latence d'un suite ne bloque pas
# l'autre. Cache des dependances keye par lockfile.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack-lint:
    name: stack-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_stack.sh
      - run: bash scripts/check_stack_test.sh

  api-rspec:
    name: api-rspec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/api
          bundler-cache: true
      - run: bundle exec rspec

  web-vitest:
    name: web-vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test

  scanner-go:
    name: scanner-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
