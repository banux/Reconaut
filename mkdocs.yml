# SPDX-License-Identifier: AGPL-3.0-only
# Configuration MkDocs Material pour le site de doc public.
#
# Cf. openspec/changes/add-doc-site/specs/open-source-governance/spec.md
#   -> Requirement: Public Documentation Site
#
# Build : `mkdocs build --strict` (échoue sur tout warning).
# Dev   : `mkdocs serve` (live reload sur 127.0.0.1:8000).

site_name: Reconaut
site_description: Base de connaissance d'actifs internet pour agents IA, scope-driven, AGPL-3.0
site_url: https://banux.github.io/Reconaut/
repo_url: https://github.com/banux/Reconaut
repo_name: banux/Reconaut
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Mode clair
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  # Désactive la mention "Made with Material for MkDocs" en footer.
  generator: false

# Pas d'analytics tiers (cf. init-reconaut-platform §1.3 — interdiction
# stricte de Mixpanel/Segment/Amplitude/PostHog/Plausible/Matomo).
# `extra.analytics` est explicitement absent ; le thème Material ne
# charge alors aucun script de tracking.

nav:
  - Accueil: index.md
  - Positionnement:
      - Vue d'ensemble: positioning/agent-knowledge-base.md
  - Usage:
      - Piloter avec reconautctl: usage/reconautctl.md
      - Déclarer son scope: usage/scope.md
  - Architecture:
      - Frontière de scan: architecture/scan-frontier.md
      - MCP-first: architecture/mcp-first.md
      - Bootstrap auth: architecture/auth-bootstrap.md
      - Templates de graphe: architecture/graph-templates.md
      - Limites AGE: architecture/age-limits.md
      - Worker scaling: architecture/worker-scaling.md
  - Opérationnel:
      - Modèle de responsabilité: operating/responsibility-model.md
      - Providers d'embedding: operating/embedder-providers.md
      - Pipeline d'embedding: operating/embedding-pipeline.md
      - Streaming agent_chat: operating/agent-chat-streaming.md
      - Exports MCP: operating/mcp-exports.md
      - Déploiement du site de doc: operating/doc-site-deployment.md
  - Intégrations:
      - Scanners externes: integrations/external-scanners.md
  - Référence:
      - Outils MCP: reference/mcp-tools.md
      - Routes REST: reference/rest-routes.md
  - ADR:
      - Choix de licence: adr/0001-license.md
